name: Vivi - verificar build do piloto

on:
  pull_request:
    paths:
      - 'ofertas-da-vivi/**'
      - 'tools/vivi-shopee-extension/**'
      - '.github/workflows/vivi-build-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: ofertas-da-vivi
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate Chrome extension and desktop one-click flow
        run: |
          node --check ../tools/vivi-shopee-extension/popup.js
          node --check ../tools/vivi-shopee-extension/background.js
          node --check ../tools/vivi-shopee-extension/batch.js
          node --check ../tools/vivi-shopee-extension/capture-page.js
          node --test ../tools/vivi-shopee-extension/tests/*.test.cjs
      - name: Next build
        run: npm run build
